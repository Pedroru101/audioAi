<!DOCTYPE html>
<html>
<head>
    <title>Reporte de Reunión</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        h1 { color: #333; }
        .section { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        img { max-width: 100%; }
    </style>
</head>
<body>
    <h1>Reporte de Reunión: {{ data.meeting_id }}</h1>
    <div class="section">
        <h2>Transcripción</h2>
        <p>{{ data.transcription }}</p>
    </div>
    <div class="section">
        <h2>Análisis</h2>
        <p>{{ data.analysis.summary }}</p>
        <img src="{{ data.graph_path }}" alt="Gráfico de Sentimiento">
    </div>
    <div class="section">
        <h2>Métricas</h2>
        <table>
            <tr><th>Métrica</th><th>Valor</th></tr>
            {% for key, value in data.analysis.metrics.items() %}
            <tr><td>{{ key }}</td><td>{{ value }}</td></tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
